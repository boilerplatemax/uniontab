<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions -->
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E11D48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BE123C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF1F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle shadow filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background - Clean white -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Hero Section with rose gradient -->
  <rect x="0" y="0" width="400" height="140" fill="url(#roseGradient)"/>

  <!-- Logo placeholder with white frame -->
  <rect x="160" y="30" width="80" height="80" fill="#FFFFFF" rx="16" filter="url(#cardShadow)"/>
  <text x="200" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#E11D48" text-anchor="middle" font-weight="bold">U</text>

  <!-- Premium badge -->
  <rect x="165" y="115" width="70" height="18" fill="rgba(255,255,255,0.2)" rx="9"/>
  <text x="200" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#FFFFFF" text-anchor="middle" font-weight="600" letter-spacing="1">PREMIUM</text>

  <!-- Contact bar strip -->
  <rect y="140" width="400" height="24" fill="#FFFFFF"/>
  <line x1="0" y1="140" x2="400" y2="140" stroke="#EBEBEB" stroke-width="1"/>
  <line x1="0" y1="164" x2="400" y2="164" stroke="#EBEBEB" stroke-width="1"/>
  <text x="100" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#717171" text-anchor="middle">contact@union.org</text>
  <text x="300" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#717171" text-anchor="middle">(555) 123-4567</text>

  <!-- Content card with rounded corners -->
  <rect x="20" y="176" width="360" height="110" fill="#FFFFFF" rx="20" stroke="#EBEBEB" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Navigation Tabs -->
  <text x="50" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E11D48" font-weight="600">News</text>
  <rect x="40" y="204" width="30" height="2" fill="#E11D48" rx="1"/>
  <text x="110" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#717171">About</text>
  <text x="165" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#717171">Files</text>
  <text x="215" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#717171">Events</text>

  <!-- Divider line under tabs -->
  <line x1="35" y1="212" x2="365" y2="212" stroke="#EBEBEB" stroke-width="1"/>

  <!-- Post Card 1 - Clean minimal style -->
  <rect x="35" y="222" width="330" height="28" fill="#FAFAFA" rx="8"/>
  <rect x="45" y="230" width="3" height="12" fill="#E11D48" rx="1.5"/>
  <text x="58" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#222222" font-weight="500">Important Announcement</text>
  <text x="340" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E11D48">12</text>

  <!-- Post Card 2 - Clean minimal style -->
  <rect x="35" y="256" width="330" height="28" fill="#FAFAFA" rx="8"/>
  <rect x="45" y="264" width="3" height="12" fill="#FDA4AF" rx="1.5"/>
  <text x="58" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#222222" font-weight="500">Member Benefits Update</text>
  <text x="340" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#E11D48">8</text>
</svg>
