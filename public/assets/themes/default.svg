<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f3f4f6"/>

  <!-- Cover Photo -->
  <rect width="400" height="120" fill="#3b82f6"/>
  <text x="200" y="70" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Cover Photo Area</text>

  <!-- Profile Section -->
  <rect y="100" width="400" height="80" fill="white"/>

  <!-- Logo Circle (overlapping) -->
  <circle cx="50" cy="110" r="30" fill="#1e40af" stroke="white" stroke-width="3"/>
  <text x="50" y="118" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">L</text>

  <!-- Union Name -->
  <text x="100" y="130" font-family="Arial" font-size="18" fill="#111827" font-weight="bold">Union Name</text>

  <!-- Contact Info Bar -->
  <rect y="140" width="400" height="40" fill="#e5e7eb"/>
  <text x="20" y="165" font-family="Arial" font-size="12" fill="#6b7280">📧 email@union.org   📞 (555) 123-4567</text>

  <!-- Tabs -->
  <rect y="180" width="400" height="40" fill="white"/>
  <text x="30" y="205" font-family="Arial" font-size="13" fill="#3b82f6" font-weight="bold">About</text>
  <text x="100" y="205" font-family="Arial" font-size="13" fill="#6b7280">Posts</text>
  <text x="160" y="205" font-family="Arial" font-size="13" fill="#6b7280">Events</text>
  <text x="230" y="205" font-family="Arial" font-size="13" fill="#6b7280">Files</text>

  <!-- Content Area -->
  <rect y="220" width="400" height="80" fill="#fafafa"/>
  <rect x="20" y="235" width="360" height="50" fill="white" stroke="#e5e7eb"/>
  <text x="35" y="255" font-family="Arial" font-size="11" fill="#6b7280">Tab content appears here...</text>
</svg>
