  <text x="150" y="113" font-family="Arial" font-size="10" fill="#374151">Important update about...</text>

  <!-- Post 2 -->
  <rect x="135" y="145" width="250" height="65" fill="white" stroke="#e5e7eb" rx="8"/>
  <circle cx="150" cy="163" r="12" fill="#93c5fd"/>
