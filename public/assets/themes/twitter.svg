  <text x="150" y="193" font-family="Arial" font-size="10" fill="#374151">Check out our latest...</text>

  <!-- Post 3 -->
  <rect x="135" y="225" width="250" height="65" fill="white" stroke="#e5e7eb" rx="8"/>
  <circle cx="150" cy="243" r="12" fill="#93c5fd"/>
  <text x="168" y="245" font-family="Arial" font-size="11" fill="#111827" font-weight="bold">Announcements</text>
  <text x="168" y="257" font-family="Arial" font-size="10" fill="#6b7280">@union · 3d</text>
  <text x="150" y="273" font-family="Arial" font-size="10" fill="#374151">Meeting scheduled for...</text>
</svg>
