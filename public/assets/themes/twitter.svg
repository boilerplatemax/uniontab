  <text x="60" y="37" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">U</text>

  <!-- Navigation Items -->
  <g>
    <!-- Home -->
    <rect x="15" y="60" width="90" height="32" fill="#dbeafe" rx="16"/>
